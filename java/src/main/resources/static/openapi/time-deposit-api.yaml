openapi: 3.0.3
info:
  title: XA Bank Time Deposit API
  version: 1.0.0
  description: |
    Time deposits of XA Bank.

    * `POST /time-deposits/balance-updates` applies one month of interest to **all** time deposits.
    * `GET /time-deposits` lists all time deposits with their withdrawals.

    Interest rules (annual rate, applied monthly as `balance * rate / 12`, rounded to cents, HALF_UP):

    | plan      | annual rate | earns interest when          |
    |-----------|-------------|------------------------------|
    | `basic`   | 1%          | days > 30                    |
    | `student` | 3%          | 30 < days <= 365             |
    | `premium` | 5%          | days > 45                    |
    | other     | -           | never (balance unchanged)    |
servers:
  - url: http://localhost:8080
tags:
  - name: TimeDeposits
    description: Time deposit plans and their balances
paths:
  /time-deposits:
    get:
      tags: [TimeDeposits]
      operationId: getAllTimeDeposits
      summary: Retrieve all time deposits
      responses:
        '200':
          description: All time deposits, ordered by id, each with its withdrawals ordered by date.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeDeposit'
  /time-deposits/balance-updates:
    post:
      tags: [TimeDeposits]
      operationId: updateAllBalances
      summary: Update the balances of all time deposits
      description: |
        Applies one month of interest to every time deposit in the database, according to its plan.
        The operation is not idempotent: every call credits another month of interest. It is meant to be
        triggered once per month (e.g. by a scheduler). No request body.
        Runs under a cluster-wide lock: if another update is already running (on any instance), the call fails
        immediately with 409 and changes nothing.
      responses:
        '204':
          description: Balances of all time deposits were updated.
        '409':
          description: Another balance update is in progress (on this or another instance); nothing was changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Balance update already in progress
        status:
          type: integer
          format: int32
          example: 409
        detail:
          type: string
        instance:
          type: string
    TimeDeposit:
      type: object
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        planType:
          type: string
          description: Plan type. Known plans are `basic`, `student` and `premium`.
          example: premium
        balance:
          type: number
          description: Current balance, 2 decimal places.
          example: 1234567.00
        days:
          type: integer
          format: int32
          description: Age of the deposit in days.
          example: 46
        withdrawals:
          type: array
          items:
            $ref: '#/components/schemas/Withdrawal'
    Withdrawal:
      type: object
      required: [id, amount, date]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        amount:
          type: number
          example: 100.00
        date:
          type: string
          format: date
          example: '2026-10-15'
