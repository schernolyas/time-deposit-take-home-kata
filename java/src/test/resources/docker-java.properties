# Docker Engine 29+ (Docker Desktop 4.52+) rejects Docker API versions below 1.44 with HTTP 400,
# while the docker-java client shaded into Testcontainers 1.21.x (managed by Spring Boot 3.5.7)
# defaults to an older API version. Pin the API version so Testcontainers can talk to current Docker.
# Requires Docker Engine 25+ (API 1.44).
api.version=1.44
